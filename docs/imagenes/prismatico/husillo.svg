<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="rosca" width="6" height="10" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="6" height="10" fill="#9aa3ad"/>
      <rect width="2.5" height="10" fill="#5b6570"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c76b00"/>
    </marker>
  </defs>
  <rect width="900" height="270" rx="12" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#1f2933">1 · Husillo T8: varilla roscada en el eje del NEMA</text>

  <!-- canal de E2 -->
  <rect x="80" y="104" width="520" height="72" rx="8" fill="#f2f4f7" stroke="#9aa3ad" stroke-width="1.5"/>
  <!-- cubo del hombro (J2) -->
  <circle cx="525" cy="140" r="46" fill="#f8f9fa" stroke="#9aa3ad" stroke-width="1.5"/>
  <circle cx="525" cy="140" r="5" fill="#1f2933"/>

  <!-- varilla roscada -->
  <rect x="104" y="135" width="380" height="10" fill="url(#rosca)"/>
  <!-- tubo de E3 (semitransparente: la varilla queda adentro) -->
  <rect x="300" y="122" width="470" height="36" rx="3" fill="#cfd6de" fill-opacity="0.6" stroke="#7b8794" stroke-width="1.5"/>
  <!-- tuerca -->
  <rect x="300" y="128" width="26" height="24" rx="2" fill="#c9a227" stroke="#8a6d10"/>
  <!-- brida -->
  <rect x="770" y="104" width="16" height="72" rx="2" fill="#e8871e"/>

  <!-- NEMA y acople -->
  <rect x="26" y="110" width="54" height="60" rx="4" fill="#6e757d"/>
  <text x="53" y="144" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">NEMA</text>
  <rect x="80" y="130" width="24" height="20" rx="3" fill="#b0b6bd" stroke="#7b8794"/>

  <!-- giro del motor -->
  <path d="M 40 96 A 18 10 0 1 1 66 96" fill="none" stroke="#c76b00" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="53" y="78" font-size="11" fill="#c76b00" text-anchor="middle">gira</text>
  <!-- avance -->
  <line x1="640" y1="96" x2="760" y2="96" stroke="#c76b00" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="700" y="88" font-size="12" fill="#c76b00" text-anchor="middle" font-weight="600">avanza 8 mm por vuelta</text>

  <!-- rótulos -->
  <g font-size="12" fill="#3e4c59">
    <line x1="313" y1="152" x2="313" y2="205" stroke="#9aa3ad"/><text x="313" y="219" text-anchor="middle">tuerca de bronce (en el tubo)</text>
    <line x1="200" y1="145" x2="200" y2="190" stroke="#9aa3ad"/><text x="200" y="204" text-anchor="middle">varilla T8 de 400 mm</text>
    <line x1="92" y1="150" x2="92" y2="174" stroke="#9aa3ad"/><text x="92" y="188" text-anchor="middle">acople</text>
    <text x="525" y="84" text-anchor="middle">J2</text>
    <text x="640" y="152" text-anchor="middle">tubo de E3</text>
    <text x="778" y="194" text-anchor="middle">brida</text>
  </g>

  <!-- cota detrás de J2 -->
  <line x1="26" y1="246" x2="525" y2="246" stroke="#e5484d" stroke-width="1.5"/>
  <line x1="26" y1="238" x2="26" y2="254" stroke="#e5484d" stroke-width="1.5"/>
  <line x1="525" y1="238" x2="525" y2="254" stroke="#e5484d" stroke-width="1.5"/>
  <rect x="200" y="236" width="150" height="20" fill="#ffffff"/>
  <text x="275" y="251" font-size="12" fill="#e5484d" text-anchor="middle" font-weight="600">452 mm detrás de J2</text>
</svg>
