<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="340" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2933">Largo del brazo a escala (J3 retraído y extendido)</text>

  <!-- zona de la esfera de trabajo: rho 244,5 ... 544,3 mm desde J2 (escala 0,75 px/mm, J2 en x = 400) -->
  <rect x="583" y="56" width="225" height="236" fill="#fff4e6"/>
  <text x="695" y="72" font-size="12" fill="#c76b00" text-anchor="middle">esfera de trabajo</text>
  <text x="695" y="86" font-size="11" fill="#c76b00" text-anchor="middle">ρ 244 … 544 mm</text>

  <!-- eje J2 -->
  <line x1="400" y1="52" x2="400" y2="296" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="407" y="64" font-size="12" fill="#1f2933" font-weight="600">eje J2</text>

  <!-- fila 1: v6 husillo (452 detrás, labio a 227,8 y 577,8) -->
  <text x="24" y="114" font-size="13" font-weight="600" fill="#1f2933">1 · Husillo (v6)</text>
  <rect x="61" y="122" width="339" height="22" rx="4" fill="#e5484d"/>
  <text x="230" y="138" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">452 mm detrás</text>
  <rect x="400" y="122" width="171" height="22" rx="4" fill="#8c96a0"/>
  <rect x="571" y="122" width="262" height="22" rx="4" fill="none" stroke="#8c96a0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="702" y="138" font-size="11" fill="#5b6570" text-anchor="middle">+350 mm</text>

  <!-- fila 2: v7A correa (377 detrás, labio a 227,8 y 567,8) -->
  <text x="24" y="186" font-size="13" font-weight="600" fill="#1f2933">2 · Correa (v7A, oficial)</text>
  <rect x="117" y="194" width="283" height="22" rx="4" fill="#f5a524"/>
  <text x="258" y="210" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">377 mm detrás</text>
  <rect x="400" y="194" width="171" height="22" rx="4" fill="#8c96a0"/>
  <rect x="571" y="194" width="255" height="22" rx="4" fill="none" stroke="#8c96a0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="698" y="210" font-size="11" fill="#5b6570" text-anchor="middle">+340 mm</text>

  <!-- fila 3: v7B telescópica (204 detrás) -->
  <text x="24" y="258" font-size="13" font-weight="600" fill="#1f2933">3 · Telescópica (v7B)</text>
  <rect x="247" y="266" width="153" height="22" rx="4" fill="#30a46c"/>
  <text x="323" y="282" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">204 mm</text>
  <rect x="400" y="266" width="171" height="22" rx="4" fill="#8c96a0"/>
  <rect x="571" y="266" width="255" height="22" rx="4" fill="none" stroke="#8c96a0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="698" y="282" font-size="11" fill="#5b6570" text-anchor="middle">+340 mm</text>

  <!-- leyenda -->
  <rect x="24" y="312" width="14" height="10" rx="2" fill="#e5484d"/>
  <text x="44" y="321" font-size="11" fill="#3e4c59">brazo detrás del hombro (lo que hay que acortar)</text>
  <rect x="330" y="312" width="14" height="10" rx="2" fill="#8c96a0"/>
  <text x="350" y="321" font-size="11" fill="#3e4c59">J2 → labio de la ventosa, retraído</text>
  <rect x="560" y="312" width="14" height="10" rx="2" fill="none" stroke="#8c96a0" stroke-dasharray="3 2"/>
  <text x="580" y="321" font-size="11" fill="#3e4c59">carrera de J3</text>
</svg>
