<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c76b00"/>
    </marker>
  </defs>
  <rect width="900" height="270" rx="12" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="600" fill="#1f2933">2 · Correa GT2 de una etapa (diseño oficial)</text>

  <!-- canal de E2 con la ranura de la correa arriba -->
  <rect x="120" y="72" width="480" height="104" rx="8" fill="#f2f4f7" stroke="#9aa3ad" stroke-width="1.5"/>
  <circle cx="540" cy="140" r="34" fill="#f8f9fa" stroke="#9aa3ad" stroke-width="1.5"/>
  <circle cx="540" cy="140" r="5" fill="#1f2933"/>

  <!-- tubo de E3 -->
  <rect x="300" y="120" width="480" height="36" rx="3" fill="#cfd6de" stroke="#7b8794" stroke-width="1.5"/>
  <rect x="780" y="102" width="16" height="72" rx="2" fill="#e8871e"/>

  <!-- correa: lazo entre la polea del motor y la loca; los dos extremos en la pinza -->
  <path d="M 318 106 L 495 106 A 11 11 0 0 0 495 84 L 150 84 A 11 11 0 0 0 150 106 L 298 106"
        fill="none" stroke="#1f2933" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="495" cy="95" r="9" fill="#b0b6bd" stroke="#5b6570"/>
  <circle cx="150" cy="95" r="9" fill="#b0b6bd" stroke="#5b6570"/>
  <!-- pinza en el tapón trasero del tubo -->
  <rect x="296" y="100" width="24" height="56" rx="2" fill="#e8871e"/>

  <!-- NEMA vertical sobre el cubo -->
  <rect x="470" y="40" width="50" height="34" rx="4" fill="#6e757d"/>
  <text x="495" y="62" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">NEMA</text>
  <line x1="495" y1="74" x2="495" y2="86" stroke="#5b6570" stroke-width="3"/>

  <!-- movimiento -->
  <line x1="640" y1="196" x2="770" y2="196" stroke="#c76b00" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="705" y="214" font-size="12" fill="#c76b00" text-anchor="middle" font-weight="600">avanza 40 mm por vuelta</text>
  <line x1="420" y1="78" x2="360" y2="78" stroke="#c76b00" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="360" y1="113" x2="420" y2="113" stroke="#c76b00" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- rótulos -->
  <g font-size="12" fill="#3e4c59">
    <text x="540" y="30" text-anchor="middle">motor arriba del cubo (casi sobre J2)</text>
    <line x1="150" y1="104" x2="150" y2="196" stroke="#9aa3ad"/><text x="150" y="210" text-anchor="middle">polea loca (M5)</text>
    <line x1="308" y1="156" x2="308" y2="196" stroke="#9aa3ad"/><text x="308" y="210" text-anchor="middle">pinza en el tapón (CB-403)</text>
    <text x="540" y="192" text-anchor="middle">J2</text>
    <text x="680" y="143" text-anchor="middle">tubo de E3 (440 mm)</text>
  </g>

  <!-- cota -->
  <line x1="120" y1="246" x2="540" y2="246" stroke="#f5a524" stroke-width="1.5"/>
  <line x1="120" y1="238" x2="120" y2="254" stroke="#f5a524" stroke-width="1.5"/>
  <line x1="540" y1="238" x2="540" y2="254" stroke="#f5a524" stroke-width="1.5"/>
  <rect x="255" y="236" width="150" height="20" fill="#ffffff"/>
  <text x="330" y="251" font-size="12" fill="#c76b00" text-anchor="middle" font-weight="600">377 mm detrás de J2</text>
</svg>
